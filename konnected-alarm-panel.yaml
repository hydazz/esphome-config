---
substitutions:
  system_name: konnected-alarm-panel
  friendly_name: Konnected Alarm Panel
  device_description: Konnected Alarm Panel Pro
  name: konnected-alarm-panel
  alarm1_ignore_strapping_warning: "true"
  alarm2_ignore_strapping_warning: "true"

esp32:
  framework:
    advanced:
      flash_chip: generic
      sram1_as_iram: true

packages:
  device: !include
    file: esp32-ethernet/base.yaml
  konnected.alarm-panel-pro-ethernet: github://konnected-io/konnected-esphome/alarm-panel-pro-v1.8-ethernet.yaml@665990de82ce160c1c41456470c29aab1234e96b

esphome:
  name_add_mac_suffix: false

# remove unused components
web_server: !remove
mdns: !remove
button: !remove

ota:
  - id: !remove konnected_ota

# configuration
sensor:
  - id: !remove uptime_sensor

binary_sensor:
  - id: !extend zone1
    name: Shed Motion Sensor
    device_class: motion

  - id: !extend zone2
    name: Hall Motion Sensor
    device_class: motion
    pin:
      ignore_strapping_warning: true

  - id: !extend zone3
    name: Office Motion Sensor
    device_class: motion
    pin:
      ignore_strapping_warning: true

  - id: !extend zone4
    name: Living Room Motion Sensor
    device_class: motion

  - id: !extend zone5
    name: Master Bedroom Motion Sensor
    device_class: motion

  - id: !remove zone6 # does not work

  - id: !extend zone7
    name: Lounge Motion Sensor
    device_class: motion

  - id: !extend zone8
    name: Front Door Contact Sensor
    device_class: door

  - id: !extend zone9
    name: Laundry Door Contact Sensor
    device_class: door

  - id: !remove zone10
  - id: !remove zone11
  - id: !remove zone12
