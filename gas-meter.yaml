---
substitutions:
  system_name: gas-meter
  friendly_name: Gas Meter
  device_description: ESP32 magnetometer-based gas meter
  volume_unit: "m³"
  i2c_scl: "GPIO22"
  i2c_sda: "GPIO19"
  hide_magnetic_field_strength_sensors: "true"
  hide_half_rotations_total_sensor: "true"
  qmc5883l_update_interval: 20ms

esp32:
  framework:
    advanced:
      flash_chip: generic
      sram1_as_iram: true

packages:
  device: !include
    file: esp32/base.yaml
  meter: github://tronikos/esphome-magnetometer-water-gas-meter/esphome-gas-meter.yaml@95ce0a8f21df5c264c5ad28e74fb6b282c5cce55

switch:
  - id: !extend led
    pin:
      ignore_strapping_warning: true

wifi:
  # Apparent OOP (out of power) when unset, cfb fixing
  output_power: 10dB
