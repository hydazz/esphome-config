[tools]
python = "3.15.2"
uv = "0.13.6"
lefthook = "2.2.2"
oxfmt = "0.75.0"
node = "26.13.0"
"aqua:jdx/jactionlint" = "2.4.0"

[settings]
experimental = true
pin = true
lockfile = true
python.uv_venv_auto = "create|source"

[env]
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }

[hooks]
postinstall = "lefthook install"
