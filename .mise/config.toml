[tools]
python = "3.14.10"
uv = "0.13.6"
lefthook = "2.2.2"
oxfmt = "0.75.0"
node = "26.13.0"
"aqua:jdx/jactionlint" = "2.4.0"

[settings]
experimental = true
pin = true
lockfile = true

[env]
UV_PYTHON = "python"

[tasks.lint]
description = "Validate devices and generate source without compiling"
raw_args = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
if (( $# == 0 )); then set -- *.yaml; fi
exec uv run --locked esphome compile --only-generate "$@"
'''

[hooks]
postinstall = "lefthook install"
