[tools]
python = "3.15.2"
uv = "0.13.8"
lefthook = "2.2.2"
oxfmt = "0.75.0"
node = "26.13.1"
jactionlint = "v2.6.0"

[settings]
experimental = true
pin = true
lockfile = true

[env]
UV_PYTHON = "python"

[tasks.format]
run = ["mise fmt", "oxfmt ."]

[tasks.deps]
run = "uv sync --locked"

[tasks.lint]
description = "Validate devices and generate source without compiling"
raw_args = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
if (( $# == 0 )); then set -- *.yaml; fi
exec uv run --locked esphome compile --only-generate "$@"
'''

[tasks.compile]
description = "Compile selected devices, or all devices when none are given"
raw_args = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
if (( $# == 0 )); then set -- *.yaml; fi
exec uv run --locked esphome compile "$@"
'''

[tasks.deploy]
description = "Compile and upload a device to an explicit address"
usage = '''
arg "<config>"
arg "<address>"
'''
run = [
  'uv run --locked esphome compile "${usage_config?}"',
  'uv run --locked esphome upload "${usage_config?}" --device "${usage_address?}"',
]

[tasks.logs]
description = "Read logs from a device at an explicit address"
usage = '''
arg "<config>"
arg "<address>"
'''
run = 'uv run --locked esphome logs "${usage_config?}" --device "${usage_address?}"'

[hooks]
postinstall = "lefthook install"
